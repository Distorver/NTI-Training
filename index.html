<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Feedback Form</title>
  </head>
  <body>
    <h1>Feedback Form</h1>

    <img src="https://i.pinimg.com/1200x/89/d9/d1/89d9d1ff5c81a6646182d26010b7d48a.jpg" alt="image not found" width="600px">
    <br/>
    <a href="https://github.com/Distorver/NTI-Training" target="_blank">Github</a>
    <br/><br/>

    <form>
      <!-- ===== PART 1 (Alaa Mostafa): Personal information ===== -->
      <!-- Label + input for the user's name -->

      <!-- Username -->
      <label for="name">Name:</label>

      <!-- Username input -->
      <input type="text" id="name" name="name" placeholder="Enter your name" required />

      <br/><br/>

      <!-- Label + input for the user's email -->
      
      <!-- Email -->
      <label for="email">Email:</label>

      <!-- Email input -->
      <input type="email" id="email" name="email" placeholder="Enter your email" required />


      <br/><br/>


     <!-- ===== END OF PART 1 ===== -->

      
       <!----------------- ===== PART 2 (Mostafa Ahmed): The feedback itself ===== --------------------->

       <!----------------- Label + input for the subject of the feedback ------------------------------->
      <label for="subject">Subject</label>

      <input type="text" name="subject" id="subject" placeholder="Enter the subject of your feedback" required />
      
      <br/><br/>

        <!----------------- Label + textarea for the full message ---------------------------------------->

      <!-- Label + textarea for the full message -->
      <label for="message">Message</label>
      <br>
      <textarea name="message" id="message" placeholder="Enter your feedback here" required> </textarea>

      
      <br/><br/>

      <!------------------- ===== END OF PART 2 ===== -------------------------------------------------->


      <!-- ===== PART 3 (Ali Ayman): Rating, confirmation and buttons ===== -->
      <!-- Label + number input for a rating from 1 to 5 -->

      <label for="rating">Rating (1-5):</label>
      <input type="number" name="rating" id="rating" min="1" max="5"/>
      <br/><br/>

      <!-- Checkbox to confirm the information is correct -->

      <input type="checkbox" name="check" id="check">
      <label for="check">I confirm the information is correct</label>
      <br/><br/>


      <!-- Submit button sends the form, reset button clears it -->

      <button type="submit">Send</button>
      <button type="reset">Clear</button>

      <!-- ===== END OF PART 3 ===== -->
    </form>
  </body>
</html>
